[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ntfyer"
version = "0.1.0"
description = "CLI tool for sending, listening for, and requesting replies to ntfy.sh / self-hosted ntfy notifications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.scripts]
ntfyer = "ntfyer.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ntfyer", "ntfyer._vendor", "ntfyer.data"]

[tool.setuptools.package-data]
"ntfyer.data" = ["*.json"]
